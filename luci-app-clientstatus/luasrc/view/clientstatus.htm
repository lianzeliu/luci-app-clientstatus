<%+header%>

<style>
.cs { --bg: transparent; --surface: #fff; --text: #171717; --text2: #6b7280; --text3: #9ca3af;
  --line: #f1f2f4; --line2: #e5e7eb; --accent: #2563eb; --green: #16a34a; --red: #dc2626;
  --radius: 10px; }
.dark .cs, body.dark .cs, html.dark .cs, [data-theme="dark"] .cs {
  --surface: #17181c; --text: #e8e9ec; --text2: #9aa0aa; --text3: #6b7280;
  --line: #232529; --line2: #2e3138; --accent: #5b9cf8; --green: #4ade80; --red: #f87171; }
@media (prefers-color-scheme: dark) {
  :root:not(.light):not([data-theme="light"]) .cs {
    --surface: #17181c; --text: #e8e9ec; --text2: #9aa0aa; --text3: #6b7280;
    --line: #232529; --line2: #2e3138; --accent: #5b9cf8; --green: #4ade80; --red: #f87171; } }

.cs { max-width: 1100px; margin: 0 auto; color: var(--text); font-size: 14px; }

/* ── 顶栏 ── */
.cs-top { display: flex; justify-content: space-between; align-items: flex-end;
  padding: 6px 2px 18px; gap: 16px; flex-wrap: wrap; }
.cs-title h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
.cs-title p { margin: 5px 0 0; font-size: 13px; color: var(--text2); }
.cs-title p b { color: var(--text); font-weight: 600; }
.cs-wan { text-align: right; }
.cs-wan .cs-wan-label { font-size: 11px; color: var(--text3); letter-spacing: 1px; margin-bottom: 2px; }
.cs-wan .cs-wan-nums { display: flex; gap: 18px; justify-content: flex-end;
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums; }
.cs-wan .cs-wan-down { font-size: 24px; font-weight: 650; color: var(--green); }
.cs-wan .cs-wan-up { font-size: 24px; font-weight: 650; color: var(--accent); }

/* ── 工具条 ── */
.cs-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.cs-search { flex: 1; min-width: 160px; max-width: 320px; padding: 8px 12px;
  border: 1px solid var(--line2); border-radius: 8px; font-size: 13px;
  background: var(--surface); color: var(--text); outline: none; transition: border-color .15s; }
.cs-search::placeholder { color: var(--text3); }
.cs-search:focus { border-color: var(--accent); }
.cs-sel { padding: 8px 10px; border: 1px solid var(--line2); border-radius: 8px;
  font-size: 13px; background: var(--surface); color: var(--text2); outline: none; cursor: pointer; }
.cs-bar .cs-sp { flex: 1; }
.cs-btn { padding: 8px 14px; border: 1px solid var(--line2); border-radius: 8px;
  font-size: 13px; background: var(--surface); color: var(--text2); cursor: pointer;
  transition: all .15s; white-space: nowrap; }
.cs-btn:hover { border-color: var(--accent); color: var(--accent); }
.cs-btn:active { transform: scale(.97); }
.cs-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.cs-btn.primary:hover { opacity: .88; color: #fff; }
.cs-btn .spin { display: inline-block; animation: cs-spin 1s linear infinite; }
@keyframes cs-spin { to { transform: rotate(360deg); } }

/* ── 表格 ── */
.cs-card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; }
.cs-table { width: 100%; border-collapse: collapse; }
.cs-table th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600;
  color: var(--text3); text-transform: uppercase; letter-spacing: .8px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
  cursor: pointer; user-select: none; }
.cs-table th:hover { color: var(--accent); }
.cs-table th .arr { opacity: 0; font-size: 9px; margin-left: 3px; }
.cs-table th.sorted .arr { opacity: 1; }
.cs-table td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cs-table tr:last-child td { border-bottom: none; }
.cs-table tbody tr { transition: background .12s; }
.cs-table tbody tr:hover { background: rgba(127,127,127,.05); }
.cs-table tbody tr.off { opacity: .55; }

.cs-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 9px; }
.cs-dot.on { background: var(--green); box-shadow: 0 0 6px rgba(22,163,74,.5); }
.cs-dot.off { background: var(--text3); }
.cs-name { font-weight: 550; cursor: pointer; }
.cs-name:hover { color: var(--accent); }
.cs-mac { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11.5px; color: var(--text3); margin-top: 2px; }
.cs-ip { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; }
.cs-dur { color: var(--text2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cs-spd { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cs-spd.dn { color: var(--green); } .cs-spd.up { color: var(--accent); }
.cs-spd.zero { color: var(--text3); }
.cs-acl { font-size: 12.5px; padding: 5px 12px; border-radius: 20px; cursor: pointer;
  border: 1px solid transparent; transition: all .15s; white-space: nowrap; }
.cs-acl.allow { color: var(--green); background: rgba(22,163,74,.08); }
.cs-acl.allow:hover { color: var(--red); background: rgba(220,38,38,.08); }
.cs-acl.block { color: var(--red); background: rgba(220,38,38,.08); }
.cs-acl.block:hover { color: var(--green); background: rgba(22,163,74,.08); }
.cs-acl:disabled { opacity: .4; pointer-events: none; }

.cs-empty { text-align: center; padding: 70px 20px; color: var(--text3); font-size: 14px; }
.cs-foot { display: flex; justify-content: space-between; align-items: center;
  padding: 12px 2px 0; font-size: 12px; color: var(--text3); }
.cs-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.cs-toggle input { display: none; }
.cs-toggle .tk { width: 34px; height: 19px; border-radius: 10px; background: var(--line2);
  position: relative; transition: background .18s; }
.cs-toggle .tk::after { content: ''; position: absolute; width: 15px; height: 15px;
  border-radius: 50%; background: #fff; top: 2px; left: 2px;
  transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.cs-toggle input:checked + .tk { background: var(--accent); }
.cs-toggle input:checked + .tk::after { transform: translateX(15px); }

.cs-toast { position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 12px);
  padding: 10px 18px; border-radius: 8px; font-size: 13px; color: #fff;
  background: #171717; opacity: 0; transition: all .25s; pointer-events: none; z-index: 9999; }
.cs-toast.show { opacity: 1; transform: translate(-50%, 0); }
.cs-toast.err { background: var(--red); }

.cs-edit { padding: 4px 8px; border: 1px solid var(--accent); border-radius: 6px;
  font-size: 13px; outline: none; background: var(--surface); color: var(--text); width: 170px; }

@media (max-width: 760px) {
  .cs-top { align-items: flex-start; }
  .cs-wan { text-align: left; }
  .cs-wan .cs-wan-nums { justify-content: flex-start; }
  .cs-wan .cs-wan-down, .cs-wan .cs-wan-up { font-size: 21px; }
  .cs-card { overflow-x: auto; }
  .cs-table { min-width: 640px; }
  .cs-bar .cs-sp { display: none; }
}
</style>

<div class="cs">
  <div class="cs-top">
    <div class="cs-title">
      <h2><%:Client Status%></h2>
      <p id="cs-summary"><b>0</b> <%:online%> · <b>0</b> <%:offline%></p>
    </div>
    <div class="cs-wan">
      <div class="cs-wan-label">WAN <%:Realtime%></div>
      <div class="cs-wan-nums">
        <span class="cs-wan-down">↓ <span id="cs-wan-dn">–</span></span>
        <span class="cs-wan-up">↑ <span id="cs-wan-up">–</span></span>
      </div>
    </div>
  </div>

  <div class="cs-bar">
    <input class="cs-search" id="cs-q" placeholder="<%:Search hostname / IP / MAC%>">
    <select class="cs-sel" id="cs-f">
      <option value="all"><%:All%></option>
      <option value="online"><%:Online%></option>
      <option value="offline"><%:Offline%></option>
    </select>
    <select class="cs-sel" id="cs-a">
      <option value="all">ACL: <%:All%></option>
      <option value="Allowed"><%:Allowed%></option>
      <option value="Blocked"><%:Blocked%></option>
    </select>
    <span class="cs-sp"></span>
    <button class="cs-btn" id="cs-resetbtn"><%:Reset%></button>
    <button class="cs-btn primary" id="cs-refreshbtn"><%:Refresh%></button>
  </div>

  <div class="cs-card">
    <table class="cs-table">
      <thead><tr>
        <th data-k="status"><%:Status%><span class="arr">▲</span></th>
        <th data-k="hostname"><%:Hostname%><span class="arr">▲</span></th>
        <th data-k="ipv4"><%:IP%><span class="arr">▲</span></th>
        <th data-k="rx">↓<span class="arr">▲</span></th>
        <th data-k="tx">↑<span class="arr">▲</span></th>
        <th data-k="duration"><%:Duration%><span class="arr">▲</span></th>
        <th data-k="acl">ACL<span class="arr">▲</span></th>
      </tr></thead>
      <tbody id="cs-rows"></tbody>
    </table>
    <div class="cs-empty" id="cs-empty" style="display:none"><%:No clients found%></div>
  </div>

  <div class="cs-foot">
    <label class="cs-toggle"><input type="checkbox" id="cs-auto" checked><span class="tk"></span><%:Auto refresh%></label>
    <span id="cs-updated"></span>
  </div>
</div>
<div class="cs-toast" id="cs-toast"></div>

<script>
(function(){
"use strict";
var clients=[], speeds={}, sortK='status', sortA=true, timer=null, stimer=null, mtime=-1;
var $=function(id){return document.getElementById(id);};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function escA(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function token(){var m=location.href.match(/[?&]token=([^&]+)/);if(m)return decodeURIComponent(m[1]);
  m=document.cookie.match(/(?:^|;\s*)sysauth=([^;]*)/);return m?decodeURIComponent(m[1]):'';}
function post(url,data,cb){var p=['token='+encodeURIComponent(token())];
  for(var k in data)p.push(encodeURIComponent(k)+'='+encodeURIComponent(data[k]));
  var x=new XMLHttpRequest();x.open('POST',url,true);
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  x.onreadystatechange=function(){if(x.readyState!==4)return;
    try{cb(JSON.parse(x.responseText));}catch(e){cb({ok:false});}};
  x.send(p.join('&'));}
function toast(m,err){var t=$('cs-toast');t.textContent=m;t.className='cs-toast show'+(err?' err':'');
  setTimeout(function(){t.className='cs-toast';},2200);}

function fmt(b){if(!b||b<=0)return '–';
  if(b<1024)return b+' B/s';
  if(b<1048576)return (b/1024).toFixed(1)+' KB/s';
  if(b<1073741824)return (b/1048576).toFixed(1)+' MB/s';
  return (b/1073741824).toFixed(2)+' GB/s';}
function fmtDur(s){var m=s.match(/(\d+)d/);var d=m?+m[1]:0;m=s.match(/(\d+)h/);var h=m?+m[1]:0;
  m=s.match(/(\d+)m/);var mi=m?+m[1]:0;m=s.match(/(\d+)s/);var se=m?+m[1]:0;
  return d*86400+h*3600+mi*60+se;}
function val(c,k){switch(k){
  case 'status':return c.status==='online'?0:1;
  case 'hostname':return (c.hostname||'').toLowerCase();
  case 'ipv4':return c.ipv4||'';
  case 'rx':return (speeds[c.mac]||{}).rx||0;
  case 'tx':return (speeds[c.mac]||{}).tx||0;
  case 'duration':return fmtDur(c.duration||'');
  case 'acl':return c.acl==='Blocked'?0:1;}return '';}

function render(){
  var q=$('cs-q').value.toLowerCase(), f=$('cs-f').value, a=$('cs-a').value;
  var list=clients.slice().sort(function(x,y){var va=val(x,sortK),vb=val(y,sortK);
    if(typeof va==='number')return sortA?va-vb:vb-va;
    return sortA?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);});
  var h='', n=0, on=0;
  for(var i=0;i<list.length;i++){var c=list[i];
    if(f!=='all'&&c.status!==f)continue;
    if(a!=='all'&&c.acl!==a)continue;
    if(q&&(c.hostname+' '+c.mac+' '+(c.ipv4||'')).toLowerCase().indexOf(q)<0)continue;
    if(c.status==='online')on++;
    var sp=speeds[c.mac]||{rx:0,tx:0};
    var dot=c.status==='online'?'on':'off';
    var blk=c.acl==='Blocked';
    h+='<tr class="'+(c.status==='online'?'':'off')+'">'
      +'<td><span class="cs-dot '+dot+'"></span></td>'
      +'<td><span class="cs-name" data-mac="'+escA(c.mac)+'" data-nm="'+escA(c.hostname)+'" title="<%:Click to edit%>">'+esc(c.hostname)+'</span>'
      +'<div class="cs-mac">'+esc(c.mac)+'</div></td>'
      +'<td class="cs-ip">'+(c.status==='online'?esc(c.ipv4||'–'):'–')+'</td>'
      +'<td class="cs-spd dn'+(sp.rx?'':' zero')+'">'+fmt(sp.rx)+'</td>'
      +'<td class="cs-spd up'+(sp.tx?'':' zero')+'">'+fmt(sp.tx)+'</td>'
      +'<td class="cs-dur">'+esc(c.duration||'–')+'</td>'
      +'<td><button class="cs-acl '+(blk?'block':'allow')+'" data-mac="'+escA(c.mac)+'">'
      +(blk?'<%:Blocked%>':'<%:Allowed%>')+'</button></td></tr>';
    n++;
  }
  $('cs-rows').innerHTML=h;
  $('cs-empty').style.display=n?'none':'block';
  $('cs-summary').innerHTML='<b>'+on+'</b> <%:online%> · <b>'+(clients.length-on)+'</b> <%:offline%>';
  /* 总 WAN 速率 */
  var dr=0,ur=0;for(var m in speeds){dr+=speeds[m].rx||0;ur+=speeds[m].tx||0;}
  $('cs-wan-dn').textContent=fmt(dr);
  $('cs-wan-up').textContent=fmt(ur);
  var d=new Date();$('cs-updated').textContent='<%:Updated%> '+d.toTimeString().slice(0,8);
}

function fetchData(){var b=$('cs-refreshbtn');b.innerHTML='<span class="spin">↻</span>';
  XHR.get('<%=url("admin/services/clientstatus/data")%>',null,function(x,d){
    b.textContent='<%:Refresh%>';if(d&&d.clients){clients=d.clients;render();}});}
function fetchSpd(){XHR.get('<%=url("admin/services/clientstatus/speed")%>?_='+Date.now(),null,
  function(x,d){if(d&&d.clients){speeds=d.clients;render();}});}
function checkUpd(){XHR.get('<%=url("admin/services/clientstatus/mtime")%>?_='+Date.now(),null,
  function(x,d){if(d&&d.mtime!==undefined&&(mtime<0||d.mtime!==mtime)){mtime=d.mtime;fetchData();}});}

$('cs-rows').addEventListener('click',function(e){
  var b=e.target.closest('.cs-acl');
  if(b){b.disabled=true;
    post('<%=url("admin/services/clientstatus/toggle_acl")%>',{mac:b.getAttribute('data-mac')},function(r){
      b.disabled=false;
      if(r&&r.ok){toast(b.getAttribute('data-mac')+(r.blocked?' → <%:Blocked%>':' → <%:Allowed%>'));fetchData();}
      else toast('Error',1);});
    return;}
  var nm=e.target.closest('.cs-name');
  if(nm&&!nm.querySelector('input')){
    var mac=nm.getAttribute('data-mac'), cur=nm.getAttribute('data-nm');
    var inp=document.createElement('input');inp.className='cs-edit';inp.value=cur;inp.maxLength=64;
    nm.textContent='';nm.appendChild(inp);inp.focus();inp.select();
    var done=false;function fin(ok){if(done)return;done=true;
      if(ok&&inp.value.trim()!==cur)
        post('<%=url("admin/services/clientstatus/save_hostname")%>',{mac:mac,hostname:inp.value.trim()},
          function(r){toast(r&&r.ok?'<%:Saved%>':'Error',!(r&&r.ok));fetchData();});
      else render();}
    inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')fin(true);if(ev.key==='Escape')fin(false);});
    inp.addEventListener('blur',function(){setTimeout(function(){fin(true);},120);});
  }
});

var ths=document.querySelectorAll('.cs-table th[data-k]');
ths.forEach(function(th){th.addEventListener('click',function(){
  var k=th.getAttribute('data-k');
  if(sortK===k)sortA=!sortA;else{sortK=k;sortA=true;}
  ths.forEach(function(t){t.classList.remove('sorted');t.querySelector('.arr').textContent='▲';});
  th.classList.add('sorted');th.querySelector('.arr').textContent=sortA?'▲':'▼';render();});});
document.querySelector('.cs-table th[data-k="status"]').classList.add('sorted');

$('cs-q').addEventListener('input',render);
$('cs-f').addEventListener('change',render);
$('cs-a').addEventListener('change',render);
$('cs-refreshbtn').addEventListener('click',fetchData);
$('cs-resetbtn').addEventListener('click',function(){
  post('<%=url("admin/services/clientstatus/reset")%>',{},function(r){
    if(r&&r.ok){speeds={};toast('<%:Cleared%>');fetchData();}else toast('Error',1);});});
function auto(on){if(timer)clearInterval(timer);if(stimer)clearInterval(stimer);timer=stimer=null;
  if(on){timer=setInterval(checkUpd,30000);stimer=setInterval(fetchSpd,2000);}}
$('cs-auto').addEventListener('change',function(){auto(this.checked);});

checkUpd();fetchSpd();auto(true);
})();
</script>

<%+footer%>
